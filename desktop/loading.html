<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATLAS 个人工作台</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #f5f2eb;
        color: #25231f;
        font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
      }
      main { text-align: center; }
      .mark {
        width: 72px;
        height: 72px;
        margin: 0 auto 24px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(177, 119, 30, .36);
        border-radius: 24px;
        background: rgba(255, 255, 255, .72);
        box-shadow: 0 24px 70px rgba(74, 58, 35, .12);
        color: #ae761f;
        font-family: Georgia, serif;
        font-size: 34px;
      }
      h1 { margin: 0; font-size: clamp(30px, 4vw, 44px); font-weight: 500; letter-spacing: -.04em; }
      p { margin: 12px 0 0; color: #7d766b; font-size: 14px; letter-spacing: .14em; }
      .progress { width: 180px; height: 2px; margin: 28px auto 0; overflow: hidden; border-radius: 99px; background: #e6dfd2; }
      .progress::after { content: ""; display: block; width: 45%; height: 100%; border-radius: inherit; background: #b47b22; animation: loading 1.15s ease-in-out infinite alternate; }
      @keyframes loading { from { transform: translateX(-100%); } to { transform: translateX(225%); } }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">A</div>
      <h1>ATLAS 个人工作台</h1>
      <p>正在准备研究环境</p>
      <div class="progress" aria-hidden="true"></div>
    </main>
  </body>
</html>
