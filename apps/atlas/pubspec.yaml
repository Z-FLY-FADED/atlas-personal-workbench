name: atlas_workspace
description: WorkSpace Windows and Android personal workspace.
publish_to: none
version: 0.5.1+8
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.18.3
  flutter_secure_storage: ^9.2.4
  file_picker: ^10.3.8
  path_provider: ^2.1.5
  uuid: ^4.5.1
  crypto: ^3.0.6
  url_launcher: ^6.3.2
  http: ^1.5.0
  xml: ^6.6.1
  fsrs: ^2.0.1
  pointycastle: ^4.0.0
  archive: ^4.0.7
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/catalog.json
    - assets/knowhow.json
    - assets/images/
    - assets/branding/
