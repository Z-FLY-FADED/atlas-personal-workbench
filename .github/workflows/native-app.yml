name: WorkSpace native apps
on:
  pull_request:
    paths: ['apps/atlas/**', 'supabase/**', '.github/workflows/native-app.yml']
  workflow_dispatch:
    inputs:
      signed_android:
        description: Build Android release with repository signing secrets
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/atlas
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
  windows:
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: windows-2022
    defaults:
      run:
        working-directory: apps/atlas
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          cache: true
      - name: Configure public client connection
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if (!$env:SUPABASE_URL -or $env:SUPABASE_PUBLISHABLE_KEY -notlike 'sb_publishable_*') { throw 'Set the Supabase client connection secrets.' }
          @{SUPABASE_URL=$env:SUPABASE_URL;SUPABASE_PUBLISHABLE_KEY=$env:SUPABASE_PUBLISHABLE_KEY} | ConvertTo-Json | Set-Content config/prod.json
      - run: flutter pub get
      - run: flutter build windows --release --dart-define-from-file=config/prod.json
      - uses: actions/upload-artifact@v4
        with:
          name: WorkSpace-Windows-complete-bundle
          path: apps/atlas/build/windows/x64/runner/Release/
  android:
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/atlas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          cache: true
      - name: Configure public client connection
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          python3 - <<'PY'
          import json, os
          assert os.environ['SUPABASE_URL'].startswith('https://')
          assert os.environ['SUPABASE_PUBLISHABLE_KEY'].startswith('sb_publishable_')
          with open('config/prod.json', 'w') as file:
              json.dump({key:os.environ[key] for key in ['SUPABASE_URL','SUPABASE_PUBLISHABLE_KEY']}, file)
          PY
      - name: Restore release signing
        if: github.event_name == 'workflow_dispatch' && inputs.signed_android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          import base64, os
          for key in ['KEYSTORE_BASE64','STORE_PASSWORD','KEY_PASSWORD','KEY_ALIAS']:
              assert os.environ[key], f'Missing {key}'
          with open('android/atlas-release.jks','wb') as file:
              file.write(base64.b64decode(os.environ['KEYSTORE_BASE64']))
          with open('android/key.properties','w') as file:
              file.write('storeFile=../atlas-release.jks\n')
              for prop, env in [('storePassword','STORE_PASSWORD'),('keyPassword','KEY_PASSWORD'),('keyAlias','KEY_ALIAS')]:
                  value=os.environ[env].replace('\\','\\\\').replace('\n','\\n').replace('\r','\\r')
                  file.write(f'{prop}={value}\n')
          PY
      - run: flutter pub get
      - name: Build signed release
        if: github.event_name == 'workflow_dispatch' && inputs.signed_android
        run: flutter build apk --release --dart-define-from-file=config/prod.json
      - name: Build test APK
        if: github.event_name != 'workflow_dispatch' || !inputs.signed_android
        run: flutter build apk --debug --dart-define-from-file=config/prod.json
      - uses: actions/upload-artifact@v4
        with:
          name: WorkSpace-Android-${{ inputs.signed_android && 'signed-release' || 'debug-test' }}
          path: apps/atlas/build/app/outputs/flutter-apk/*.apk
